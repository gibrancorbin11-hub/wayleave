<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Wayleave">
  <title>Wayleave</title>
  <!--
    The mark is the idea, not decoration:
      the rounded square  = the boundary of private land (your app)
      the diagonal        = the right of passage crossing it
      the dot on the line = the point where the fee is collected
    Drawn on a 64 grid. Uses currentColor so it inherits ink from context.
  -->
  <rect x="2" y="2" width="60" height="60" rx="16"
        fill="none" stroke="currentColor" stroke-width="3" opacity="0.35"/>
  <path d="M17 47 L47 17" fill="none" stroke="currentColor"
        stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="5.5" fill="currentColor"/>
</svg>
