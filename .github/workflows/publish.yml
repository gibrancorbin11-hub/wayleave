# Publish wayleave to npm from a tag, with no token anywhere.
#
# npm trusted publishing exchanges GitHub's OIDC identity for a short-lived,
# single-use credential. Nothing long-lived is stored in this repository, in
# Actions secrets, or on anybody's laptop — which is the point. The status
# report recorded that 2FA on this account was downgraded to auth-only in
# order to publish at all, so a leaked token could put a malicious `wayleave`
# into customers' request paths. This removes the token rather than guarding
# it better.
#
# Before the first run, on npmjs.com → the `wayleave` package → Settings →
# Trusted Publisher, add:
#     repository   gibrancorbin11-hub/wayleave
#     workflow     .github/workflows/publish.yml
# and then turn "Require two-factor authentication or automation tokens" back
# ON for writes. Trusted publishing satisfies it; a stolen token will not.
#
# To release: bump the version, commit, then
#     git tag v0.5.4 && git push origin v0.5.4

name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write          # the OIDC identity npm exchanges. Nothing else.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 11.5.1+ is what knows how to do the OIDC exchange.
      - run: npm install -g npm@latest

      # The gate is zero-dependency, so there is nothing to install and
      # nothing that could run an install script on the way to a publish.
      - name: Test
        run: node --test *.test.js

      # The tag and package.json must agree, or a v0.5.4 tag quietly
      # republishes whatever version happens to be in the file.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg"
            exit 1
          fi

      # A runtime dependency would break the headline claim on the landing
      # page, so it fails the release rather than shipping quietly.
      - name: Still zero dependencies
        run: |
          deps="$(node -p 'JSON.stringify(require("./package.json").dependencies || {})')"
          [ "$deps" = "{}" ] || { echo "runtime dependencies present: $deps"; exit 1; }

      - name: Publish
        run: npm publish
